name: Platforms
# Build the helper like a release does, then install and drive it on real
# machines: Linux, macOS (Apple silicon and Intel) and Windows (x64 and ARM).
# Each one installs through the same one-liners users paste, then runs the
# live test: real Firefox + this add-on + the installed helper, over MCP.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bash scripts/build-host.sh
      - name: Lay out a release + the Pages site
        run: |
          mkdir -p out
          cp dist/host/* out/
          cp scripts/install.sh scripts/install.ps1 out/
          # What https://hamb1y.github.io/foxhand/ serves:
          cp scripts/install.sh out/sh
          cp scripts/install.ps1 out/ps
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15, name: darwin-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: windows-11-arm, name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    name: install ${{ matrix.name }}
    env:
      FOXHAND_BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Serve the release locally
        shell: bash
        run: |
          (cd release && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS && exit 0; sleep 1; done
          echo "server didn't start" && exit 1

      # ---- macOS / Linux: exactly what users paste ----
      - name: Install (curl | sh)
        if: runner.os != 'Windows'
        run: curl -fsSL http://127.0.0.1:8765/sh | sh
      - name: Installed helper runs
        if: runner.os != 'Windows'
        run: |
          case "$RUNNER_OS" in
            macOS) BIN="$HOME/Library/Application Support/foxhand/foxhand-host" ;;
            *) BIN="$HOME/.local/share/foxhand/foxhand-host" ;;
          esac
          "$BIN" status
          test "$("$BIN" version 2>&1)" = "$(node -p 'require("./package.json").version')"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: macOS signature and Gatekeeper
        if: runner.os == 'macOS'
        run: |
          codesign --verify --verbose=2 "$BIN"
          # The manual route: a browser download is quarantined; the documented xattr -c makes it runnable.
          cp "release/foxhand-host-${{ matrix.name }}" ./manual
          chmod +x ./manual
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" ./manual
          xattr -c ./manual
          ./manual version

      # ---- Windows: irm | iex in Windows PowerShell 5.1, the one every PC has ----
      - name: Install (irm | iex)
        if: runner.os == 'Windows'
        shell: powershell
        run: irm http://127.0.0.1:8765/ps | iex
      - name: Installed helper runs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bin = "$env:LOCALAPPDATA\foxhand\foxhand-host.exe"
          & $bin status
          $v = (& $bin version 2>&1 | Out-String).Trim()
          $want = (node -p "require('./package.json').version").Trim()
          if ($v -ne $want) { throw "version $v, expected $want" }

      # ---- the whole thing, live ----
      - name: Find Firefox
        id: ff
        shell: bash
        run: |
          for f in /usr/bin/firefox /Applications/Firefox.app/Contents/MacOS/firefox \
                   "/c/Program Files/Mozilla Firefox/firefox.exe" "C:/Program Files/Mozilla Firefox/firefox.exe"; do
            if [ -x "$f" ] || [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No Firefox on this runner image; the live test is skipped here."
      - name: Live test against the installed helper
        if: steps.ff.outputs.path != ''
        shell: bash
        run: node test/live.mjs --installed --firefox "${{ steps.ff.outputs.path }}"
