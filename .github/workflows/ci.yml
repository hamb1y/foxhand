name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs --check
      - run: node scripts/i18n.mjs --check
      - run: npm run build
      - run: npm run typecheck
      - run: npx --no-install web-ext lint -s extension
      - run: node test/e2e.mjs
      - run: MISSING=1 node test/e2e.mjs
      - run: node test/host.mjs
      - run: npx playwright install --with-deps firefox
      - run: node test/content.mjs
      - run: node test/options.mjs
      # Real Firefox (preinstalled on the runner) + the add-on + the helper from this checkout.
      - run: node test/live.mjs
