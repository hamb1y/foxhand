name: Pages
# Serves the short install commands:
#   curl -fsSL https://hamb1y.github.io/foxhand/sh | sh
#   irm https://hamb1y.github.io/foxhand/ps | iex
# The scripts download the helper from the latest GitHub release.
on:
  push:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'site/**', 'extension/icons/icon.svg', 'extension/fonts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          cp scripts/install.sh _site/sh
          cp scripts/install.ps1 _site/ps
          cp extension/icons/icon.svg extension/fonts/GoogleSansFlex-latin.woff2 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
