name: Cloudflare
# Release completion also deploys: workflow_run runs even when GITHUB_TOKEN made the release.
# Manual dispatch defaults to preparation only.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing published GitHub release version (without v)
        required: true
        default: '0.5.7'
        type: string
      publish:
        description: Deploy the prepared website and GitHub release redirects to Pages
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      version: ${{ steps.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Select published version
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${SELECTED_VERSION:-$(node -p 'require("./package.json").version')}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check published GitHub release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release.json
          node scripts/check-cloudflare-release.mjs release.json
      - run: npm ci
      - run: npm run build:extension
      - run: node test/cloudflare.mjs
      - run: node scripts/build-cloudflare.mjs
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-prepared
          path: dist/cloudflare
  publish:
    if: github.event_name == 'workflow_run' || inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-prepared
          path: dist/cloudflare
      # One deployment promotes pages, pinned installers, metadata and feed together.
      - name: Deploy Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.159.0 pages deploy dist/cloudflare --project-name foxhand --branch main

  verify-delivery:
    name: Verify public release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for public Pages, then install the helper
        env:
          PUBLIC_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 https://foxhand.pages.dev/download/latest.json |
                jq -e --arg version "$PUBLIC_VERSION" '.version == $version' >/dev/null; then
              node test/public-install.mjs
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public Pages did not serve Foxhand $PUBLIC_VERSION."
          exit 1
      - name: Install the public npm package
        if: github.event_name == 'workflow_run'
        env:
          PUBLIC_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/foxhand-public-npm"
          npm install --prefix "$prefix" "@foxhand/helper@$PUBLIC_VERSION"
          test "$("$prefix/node_modules/.bin/foxhand-helper" --version 2>&1)" = "$PUBLIC_VERSION"
